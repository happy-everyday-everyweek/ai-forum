<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能论坛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        
        body.light-theme {
            background: #f5f5f5;
            color: #2a2a2a;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        body.light-theme header {
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 24px;
            color: #fff;
        }
        
        body.light-theme h1 {
            color: #2a2a2a;
        }
        
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .btn-primary {
            background: rgba(100, 100, 100, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        body.light-theme .btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #2a2a2a;
        }
        
        body.light-theme .btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        
        body.light-theme .btn-primary {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        body.light-theme .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
        }
        
        body.light-theme .modal-content {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: #fff;
        }
        
        body.light-theme .modal-header h2 {
            color: #2a2a2a;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #808080;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .setting-group {
            margin-bottom: 15px;
        }
        
        .setting-group label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-size: 14px;
        }
        
        body.light-theme .setting-group label {
            color: #606060;
        }
        
        .setting-group input,
        .setting-group select,
        .setting-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        
        .setting-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        body.light-theme .setting-group input,
        body.light-theme .setting-group select,
        body.light-theme .setting-group textarea {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #2a2a2a;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-actions .btn {
            flex: 1;
        }
        
        .post-form {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        body.light-theme .post-form {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .post-form textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 10px;
            font-family: inherit;
        }
        
        body.light-theme .post-form textarea {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #2a2a2a;
        }
        
        .post {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .post:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        body.light-theme .post {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        body.light-theme .post:hover {
            border-color: rgba(0, 0, 0, 0.2);
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .author-info {
            display: flex;
            flex-direction: column;
        }
        
        .author-name {
            font-weight: 600;
            color: #fff;
        }
        
        body.light-theme .author-name {
            color: #2a2a2a;
        }
        
        .post-time {
            font-size: 12px;
            color: #808080;
        }
        
        .ai-badge {
            background: rgba(100, 100, 100, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #b0b0b0;
        }
        
        body.light-theme .ai-badge {
            background: rgba(0, 0, 0, 0.1);
            color: #606060;
        }
        
        .post-content {
            margin-bottom: 15px;
            line-height: 1.8;
            color: #d0d0d0;
        }
        
        body.light-theme .post-content {
            color: #3a3a3a;
        }
        
        .post-actions {
            display: flex;
            gap: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        body.light-theme .post-actions {
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .action-btn {
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 6px;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #b0b0b0;
        }
        
        .action-btn.active {
            color: #fff;
        }
        
        body.light-theme .action-btn {
            color: #606060;
        }
        
        body.light-theme .action-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #2a2a2a;
        }
        
        body.light-theme .action-btn.active {
            color: #2a2a2a;
        }
        
        .action-btn.delete-btn {
            color: #ff6b6b;
        }
        
        .action-btn.delete-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            color: #ff5252;
        }
        
        body.light-theme .action-btn.delete-btn {
            color: #d32f2f;
        }
        
        body.light-theme .action-btn.delete-btn:hover {
            background: rgba(211, 47, 47, 0.1);
            color: #c62828;
        }
        
        .comments-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        body.light-theme .comments-section {
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .comment {
            background: rgba(40, 40, 40, 0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        body.light-theme .comment {
            background: rgba(0, 0, 0, 0.03);
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .comment-author {
            font-weight: 600;
            font-size: 14px;
            color: #b0b0b0;
        }
        
        body.light-theme .comment-author {
            color: #606060;
        }
        
        .comment-content {
            font-size: 14px;
            color: #d0d0d0;
        }
        
        body.light-theme .comment-content {
            color: #3a3a3a;
        }
        
        .comment-form {
            margin-top: 10px;
        }
        
        .comment-form input {
            width: 100%;
            padding: 10px;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        
        body.light-theme .comment-form input {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #2a2a2a;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .calendar-day:hover {
            transform: scale(1.1);
        }
        
        .calendar-day.empty {
            background: rgba(100, 100, 100, 0.1);
        }
        
        .calendar-day.level-0 {
            background: rgba(100, 100, 100, 0.2);
        }
        
        .calendar-day.level-1 {
            background: rgba(100, 200, 100, 0.3);
        }
        
        .calendar-day.level-2 {
            background: rgba(100, 200, 100, 0.5);
        }
        
        .calendar-day.level-3 {
            background: rgba(100, 200, 100, 0.7);
        }
        
        .calendar-day.level-4 {
            background: rgba(100, 200, 100, 0.9);
        }
        
        .calendar-legend {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #808080;
            align-items: center;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        
        .day-posts {
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #808080;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .post {
                padding: 15px;
            }
            
            .header-buttons {
                gap: 5px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🤖 AI智能论坛</h1>
            <div class="header-buttons">
                <button class="btn" onclick="showCalendar()">📅</button>
                <button class="btn" onclick="showSettings()">⚙️</button>
            </div>
        </div>
    </header>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>系统设置</h2>
                <button class="close-btn" onclick="hideSettings()">✕</button>
            </div>
            <div class="setting-group">
                <label>DeepSeek API Key</label>
                <input type="password" id="apiKey" placeholder="输入你的API Key">
            </div>
            <div class="setting-group">
                <label>AI发帖频率（分钟）</label>
                <input type="number" id="aiPostInterval" value="2" min="1">
            </div>
            <div class="setting-group">
                <label>AI互动频率（秒）</label>
                <input type="number" id="aiInteractInterval" value="30" min="1">
            </div>
            <div class="setting-group">
                <label>推荐算法权重</label>
                <select id="recommendWeight">
                    <option value="high">高（强个性化）</option>
                    <option value="medium" selected>中（平衡）</option>
                    <option value="low">低（随机探索）</option>
                </select>
            </div>
            <div class="setting-group">
                <label>用户名</label>
                <input type="text" id="username" value="用户" placeholder="输入你的用户名">
            </div>
            <div class="setting-group">
                <label>主题模式</label>
                <select id="themeMode">
                    <option value="dark">深色模式</option>
                    <option value="light">浅色模式</option>
                </select>
            </div>
            <div class="setting-group">
                <label>AI工作规则（自然语言描述）</label>
                <textarea id="aiRules" placeholder="例如：多发一些关于科技的帖子，评论要简短有趣，不要太严肃..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="hideSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存并应用</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>发帖日历</h2>
                <button class="close-btn" onclick="hideCalendar()">✕</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-legend">
                <span>发帖数量：</span>
                <div class="legend-item">
                    <div class="legend-box" style="background: rgba(100, 100, 100, 0.2);"></div>
                    <span>0</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: rgba(100, 200, 100, 0.3);"></div>
                    <span>1-2</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: rgba(100, 200, 100, 0.5);"></div>
                    <span>3-5</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: rgba(100, 200, 100, 0.7);"></div>
                    <span>6-10</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: rgba(100, 200, 100, 0.9);"></div>
                    <span>10+</span>
                </div>
            </div>
            <div class="day-posts" id="dayPosts"></div>
        </div>
    </div>

    <div class="container">
        <div class="post-form">
            <textarea id="postContent" placeholder="分享你的想法..."></textarea>
            <button class="btn btn-primary" onclick="createPost()">发布</button>
        </div>

        <div id="postsContainer"></div>
    </div>

    <script>
        // 数据存储
        let posts = [];
        let userProfile = {
            likes: [],
            comments: [],
            favorites: [],
            interests: {}
        };
        let settings = {
            apiKey: '',
            aiPostInterval: 2,
            aiInteractInterval: 30,
            recommendWeight: 'medium',
            username: '用户',
            themeMode: 'dark',
            aiRules: ''
        };
        
        let aiTimers = {
            postTimer: null,
            interactTimer: null
        };

        // AI人格列表（不包含AI字样）
        const aiPersonas = [
            { name: '张明', emoji: '🤓', style: '理性分析型' },
            { name: '李红', emoji: '🌸', style: '温暖感性型' },
            { name: '王建国', emoji: '👨‍💼', style: '经验分享型' },
            { name: '刘思远', emoji: '🎨', style: '创意思维型' },
            { name: '陈博文', emoji: '👨‍🔬', style: '学术严谨型' },
            { name: '赵雨晴', emoji: '☀️', style: '乐观积极型' },
            { name: '孙浩然', emoji: '📚', style: '知识渊博型' },
            { name: '周婷婷', emoji: '💡', style: '灵感启发型' }
        ];

        // 话题库
        const topics = [
            '人工智能的未来发展趋势',
            '如何平衡工作与生活',
            '最近看的一本好书推荐',
            '科技如何改变我们的生活',
            '关于学习新技能的心得',
            '旅行中最难忘的经历',
            '健康生活方式的重要性',
            '互联网时代的信息焦虑',
            '如何培养良好的习惯',
            '对未来教育模式的思考',
            '音乐对情绪的影响',
            '电影中的人生哲理',
            '美食与文化的关系',
            '运动带来的改变',
            '阅读的力量'
        ];

        // 初始化
        function init() {
            loadData();
            renderPosts();
            startAIActivities();
        }

        // 加载本地数据
        function loadData() {
            const savedPosts = localStorage.getItem('forumPosts');
            const savedProfile = localStorage.getItem('userProfile');
            const savedSettings = localStorage.getItem('forumSettings');
            
            if (savedPosts) posts = JSON.parse(savedPosts);
            if (savedProfile) userProfile = JSON.parse(savedProfile);
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
                applySettings();
            }
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('forumPosts', JSON.stringify(posts));
            localStorage.setItem('userProfile', JSON.stringify(userProfile));
        }

        // 应用设置到界面
        function applySettings() {
            document.getElementById('apiKey').value = settings.apiKey;
            document.getElementById('aiPostInterval').value = settings.aiPostInterval;
            document.getElementById('aiInteractInterval').value = settings.aiInteractInterval;
            document.getElementById('recommendWeight').value = settings.recommendWeight;
            document.getElementById('username').value = settings.username;
            document.getElementById('themeMode').value = settings.themeMode;
            document.getElementById('aiRules').value = settings.aiRules || '';
            
            // 应用主题
            if (settings.themeMode === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }

        // 显示设置
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        // 隐藏设置
        function hideSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        // 保存设置
        function saveSettings() {
            settings.apiKey = document.getElementById('apiKey').value;
            settings.aiPostInterval = parseInt(document.getElementById('aiPostInterval').value);
            settings.aiInteractInterval = parseInt(document.getElementById('aiInteractInterval').value);
            settings.recommendWeight = document.getElementById('recommendWeight').value;
            settings.username = document.getElementById('username').value;
            settings.themeMode = document.getElementById('themeMode').value;
            settings.aiRules = document.getElementById('aiRules').value;
            
            localStorage.setItem('forumSettings', JSON.stringify(settings));
            
            // 应用设置
            applySettings();
            
            // 重启AI定时器
            restartAITimers();
            
            // 重新渲染帖子（应用推荐算法）
            renderPosts();
            
            alert('✅ 设置已保存并应用！');
            hideSettings();
        }

        // 调用DeepSeek API
        async function callDeepSeek(prompt, systemPrompt = '') {
            if (!settings.apiKey) {
                console.log('未设置API Key，使用模拟回复');
                return generateMockResponse(prompt);
            }

            try {
                // 如果有用户自定义规则，添加到系统提示中
                let finalSystemPrompt = systemPrompt || '你是一个友好、有思想的论坛用户，回复要自然、有人情味，不要太长，控制在100字以内。';
                if (settings.aiRules) {
                    finalSystemPrompt += '\n\n用户要求：' + settings.aiRules;
                }
                
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: finalSystemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.8,
                        max_tokens: 200
                    })
                });

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('API调用失败:', error);
                return generateMockResponse(prompt);
            }
        }

        // 生成模拟回复（当API不可用时）
        function generateMockResponse(prompt) {
            const responses = [
                '这个观点很有意思，我也有类似的想法。',
                '说得好！我完全同意你的看法。',
                '这让我想到了另一个角度...',
                '有道理，不过我觉得还可以从另一个方面来看。',
                '感谢分享，学到了新东西！',
                '这个话题很值得深入探讨。',
                '我也遇到过类似的情况，确实需要好好思考。',
                '很棒的分享！给了我很多启发。',
                '这个想法挺新颖的，值得尝试。',
                '我有不同的看法，但也很尊重你的观点。'
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // AI生成帖子
        async function aiGeneratePost() {
            const persona = aiPersonas[Math.floor(Math.random() * aiPersonas.length)];
            const topic = topics[Math.floor(Math.random() * topics.length)];
            
            const prompt = `作为一个${persona.style}的论坛用户，围绕"${topic}"这个话题，写一段自然、有个人观点的帖子内容，要像真人发帖一样，可以分享经历、提出问题或表达看法。控制在150字以内。`;
            
            const content = await callDeepSeek(prompt);
            
            const post = {
                id: Date.now(),
                author: persona.name,
                avatar: persona.emoji,
                content: content,
                isAI: true,
                timestamp: Date.now(),
                likes: 0,
                comments: [],
                favorites: 0
            };
            
            posts.unshift(post);
            saveData();
            renderPosts();
            
            console.log('AI发帖成功:', persona.name);
        }

        // AI互动（点赞和评论）
        async function aiInteract() {
            if (posts.length === 0) return;
            
            // 找到用户发的帖子
            const userPosts = posts.filter(p => !p.isAI);
            if (userPosts.length === 0) return;
            
            const targetPost = userPosts[Math.floor(Math.random() * userPosts.length)];
            const action = Math.random() > 0.5 ? 'like' : 'comment';
            
            if (action === 'like') {
                targetPost.likes++;
                console.log('AI点赞了用户的帖子');
            } else {
                const persona = aiPersonas[Math.floor(Math.random() * aiPersonas.length)];
                const prompt = `针对这个帖子："${targetPost.content}"，写一条简短、自然的评论，要像真人评论一样。控制在50字以内。`;
                const commentContent = await callDeepSeek(prompt);
                
                targetPost.comments.push({
                    id: Date.now(),
                    author: persona.name,
                    avatar: persona.emoji,
                    content: commentContent,
                    isAI: true,
                    timestamp: Date.now()
                });
                console.log('AI评论了用户的帖子:', persona.name);
            }
            
            saveData();
            renderPosts();
        }

        // 启动AI活动
        function startAIActivities() {
            restartAITimers();
        }
        
        // 重启AI定时器
        function restartAITimers() {
            // 清除旧的定时器
            if (aiTimers.postTimer) clearInterval(aiTimers.postTimer);
            if (aiTimers.interactTimer) clearInterval(aiTimers.interactTimer);
            
            // AI定期发帖
            aiTimers.postTimer = setInterval(() => {
                aiGeneratePost();
            }, settings.aiPostInterval * 60 * 1000);
            
            // AI定期互动（秒）
            aiTimers.interactTimer = setInterval(() => {
                aiInteract();
            }, settings.aiInteractInterval * 1000);
            
            console.log('AI定时器已启动 - 发帖间隔:', settings.aiPostInterval, '分钟, 互动间隔:', settings.aiInteractInterval, '秒');
        }

        // 用户创建帖子
        async function createPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content) {
                alert('请输入内容');
                return;
            }
            
            const post = {
                id: Date.now(),
                author: settings.username,
                avatar: '👤',
                content: content,
                isAI: false,
                timestamp: Date.now(),
                likes: 0,
                comments: [],
                favorites: 0
            };
            
            posts.unshift(post);
            saveData();
            renderPosts();
            
            document.getElementById('postContent').value = '';
            
            // 更新用户兴趣
            updateUserInterests(content);
        }

        // 更新用户兴趣模型
        function updateUserInterests(content) {
            const keywords = content.split(/\s+/);
            keywords.forEach(word => {
                if (word.length > 1) {
                    userProfile.interests[word] = (userProfile.interests[word] || 0) + 1;
                }
            });
            saveData();
        }

        // 计算帖子推荐分数
        function calculateRecommendScore(post) {
            let score = 0;
            
            // 基础热度分数
            score += post.likes * 2;
            score += post.comments.length * 3;
            score += post.favorites * 5;
            
            // 时间衰减
            const hoursSincePost = (Date.now() - post.timestamp) / (1000 * 60 * 60);
            score *= Math.exp(-hoursSincePost / 24);
            
            // 个性化推荐
            if (settings.recommendWeight !== 'low') {
                const contentWords = post.content.split(/\s+/);
                let interestMatch = 0;
                contentWords.forEach(word => {
                    if (userProfile.interests[word]) {
                        interestMatch += userProfile.interests[word];
                    }
                });
                
                if (settings.recommendWeight === 'high') {
                    score += interestMatch * 10;
                } else {
                    score += interestMatch * 5;
                }
            }
            
            return score;
        }

        // 渲染帖子列表
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="loading">暂无帖子，等待AI发帖或自己发布第一条帖子吧！</div>';
                return;
            }
            
            // 排序帖子
            const sortedPosts = [...posts].sort((a, b) => {
                return calculateRecommendScore(b) - calculateRecommendScore(a);
            });
            
            container.innerHTML = sortedPosts.map(post => `
                <div class="post">
                    <div class="post-header">
                        <div class="post-author">
                            <div class="avatar">${post.avatar}</div>
                            <div class="author-info">
                                <div class="author-name">
                                    ${post.author}
                                    ${post.isAI ? '<span class="ai-badge">AI</span>' : ''}
                                </div>
                                <div class="post-time">${formatTime(post.timestamp)}</div>
                            </div>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions">
                        <button class="action-btn ${userProfile.likes.includes(post.id) ? 'active' : ''}" 
                                onclick="toggleLike(${post.id})">
                            👍 ${post.likes}
                        </button>
                        <button class="action-btn">
                            💬 ${post.comments.length}
                        </button>
                        <button class="action-btn ${userProfile.favorites.includes(post.id) ? 'active' : ''}" 
                                onclick="toggleFavorite(${post.id})">
                            ⭐ ${post.favorites}
                        </button>
                        ${!post.isAI ? `<button class="action-btn delete-btn" onclick="deletePost(${post.id})">🗑️ 删除</button>` : ''}
                    </div>
                    <div class="comments-section" id="comments-${post.id}">
                        ${post.comments.map(comment => `
                            <div class="comment">
                                <div class="comment-header">
                                    <span class="comment-author">
                                        ${comment.avatar} ${comment.author}
                                        ${comment.isAI ? '<span class="ai-badge">AI</span>' : ''}
                                    </span>
                                    <span class="post-time">${formatTime(comment.timestamp)}</span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('')}
                        <div class="comment-form">
                            <input type="text" placeholder="写下你的评论..." 
                                   onkeypress="if(event.key==='Enter') addComment(${post.id}, this.value)">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 格式化时间
        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return new Date(timestamp).toLocaleDateString('zh-CN');
        }

        // 删除帖子
        function deletePost(postId) {
            if (!confirm('确定要删除这条帖子吗？')) return;
            
            const index = posts.findIndex(p => p.id === postId);
            if (index > -1) {
                posts.splice(index, 1);
                
                // 清理用户数据中的相关记录
                userProfile.likes = userProfile.likes.filter(id => id !== postId);
                userProfile.favorites = userProfile.favorites.filter(id => id !== postId);
                userProfile.comments = userProfile.comments.filter(id => id !== postId);
                
                saveData();
                renderPosts();
            }
        }

        // 切换点赞
        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const index = userProfile.likes.indexOf(postId);
            if (index > -1) {
                userProfile.likes.splice(index, 1);
                post.likes--;
            } else {
                userProfile.likes.push(postId);
                post.likes++;
            }
            
            saveData();
            renderPosts();
        }

        // 切换收藏
        function toggleFavorite(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const index = userProfile.favorites.indexOf(postId);
            if (index > -1) {
                userProfile.favorites.splice(index, 1);
                post.favorites--;
            } else {
                userProfile.favorites.push(postId);
                post.favorites++;
            }
            
            saveData();
            renderPosts();
        }

        // 添加评论
        function addComment(postId, content) {
            if (!content || !content.trim()) return;
            
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const comment = {
                id: Date.now(),
                author: settings.username,
                avatar: '👤',
                content: content.trim(),
                isAI: false,
                timestamp: Date.now()
            };
            
            post.comments.push(comment);
            userProfile.comments.push(postId);
            
            saveData();
            renderPosts();
            
            // 更新用户兴趣
            updateUserInterests(content);
        }

        // 显示日历
        function showCalendar() {
            document.getElementById('calendarModal').classList.add('active');
            renderCalendar();
        }

        // 隐藏日历
        function hideCalendar() {
            document.getElementById('calendarModal').classList.remove('active');
        }

        // 渲染日历
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const today = new Date();
            const days = 90; // 显示最近90天
            
            // 统计每天的发帖数
            const postsByDay = {};
            posts.filter(p => !p.isAI).forEach(post => {
                const date = new Date(post.timestamp).toLocaleDateString('zh-CN');
                postsByDay[date] = (postsByDay[date] || 0) + 1;
            });
            
            let html = '';
            for (let i = days - 1; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toLocaleDateString('zh-CN');
                const count = postsByDay[dateStr] || 0;
                
                let level = 0;
                if (count === 0) level = 0;
                else if (count <= 2) level = 1;
                else if (count <= 5) level = 2;
                else if (count <= 10) level = 3;
                else level = 4;
                
                html += `<div class="calendar-day level-${level}" 
                             onclick="showDayPosts('${dateStr}')" 
                             title="${dateStr}: ${count}条帖子">
                            ${date.getDate()}
                         </div>`;
            }
            
            grid.innerHTML = html;
        }

        // 显示某天的帖子
        function showDayPosts(dateStr) {
            const dayPostsDiv = document.getElementById('dayPosts');
            const dayPosts = posts.filter(p => {
                if (p.isAI) return false;
                const postDate = new Date(p.timestamp).toLocaleDateString('zh-CN');
                return postDate === dateStr;
            });
            
            if (dayPosts.length === 0) {
                dayPostsDiv.innerHTML = `<div style="margin-top: 20px; color: #808080;">📅 ${dateStr} 没有发帖</div>`;
                return;
            }
            
            dayPostsDiv.innerHTML = `
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 15px; color: #fff;">📅 ${dateStr} (${dayPosts.length}条)</h3>
                    ${dayPosts.map(post => `
                        <div style="background: rgba(40, 40, 40, 0.5); padding: 12px; border-radius: 8px; margin-bottom: 10px;">
                            <div style="font-size: 14px; color: #d0d0d0; margin-bottom: 5px;">${post.content}</div>
                            <div style="font-size: 12px; color: #808080;">
                                👍 ${post.likes} · 💬 ${post.comments.length} · ⭐ ${post.favorites}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 页面加载时初始化
        window.onload = init;
    </script>
</body>
</html>
