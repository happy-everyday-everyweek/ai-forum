<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能论坛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;line-height:1.6;transition:background .3s,color .3s;padding-bottom:100px}
body.light-theme{background:#f5f5f5;color:#2a2a2a}
.container{max-width:800px;margin:0 auto;padding:20px}
header{background:rgba(20,20,20,.9);backdrop-filter:blur(10px);padding:15px 20px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.1)}
body.light-theme header{background:rgba(255,255,255,.9);border-bottom:1px solid rgba(0,0,0,.1)}
.header-content{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px;color:#fff}
body.light-theme h1{color:#2a2a2a}
.header-buttons{display:flex;gap:10px}
.search-box{flex:1;max-width:300px;margin:0 15px}
.search-box input{width:100%;padding:8px 12px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-size:14px}
body.light-theme .search-box input{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .3s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn-primary{background:rgba(100,100,100,.3);border:1px solid rgba(255,255,255,.3)}
body.light-theme .btn{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
body.light-theme .btn:hover{background:rgba(0,0,0,.1)}
body.light-theme .btn-primary{background:rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.2)}
.fab{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:rgba(100,100,100,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.fab:hover{transform:scale(1.1);background:rgba(120,120,120,.6)}
.fab.hidden{opacity:0;pointer-events:none}
body.light-theme .fab{background:rgba(200,200,200,.5);border:1px solid rgba(0,0,0,.2)}
.post-cards{position:fixed;bottom:30px;right:30px;display:none;flex-direction:column;gap:15px;z-index:200;width:90%;max-width:500px}
.post-cards.active{display:flex;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.post-card{background:rgba(20,20,20,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s ease}
.post-card:hover{border-color:rgba(255,255,255,.3)}
body.light-theme .post-card{background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.1)}
.post-input-wrapper{display:flex;align-items:center;gap:10px}
.post-input-wrapper input{flex:1;padding:12px 18px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:25px;color:#fff;font-size:15px;font-family:inherit}
body.light-theme .post-input-wrapper input{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.post-input-wrapper textarea{flex:1;padding:12px 18px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:25px;color:#fff;font-size:15px;font-family:inherit;resize:none;overflow:hidden;transition:all .3s}
body.light-theme .post-input-wrapper textarea{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.post-input-wrapper.fullscreen textarea{border-radius:15px;min-height:200px;resize:vertical;overflow:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(100,100,100,.3);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:18px}
.icon-btn:hover{background:rgba(120,120,120,.5);transform:scale(1.1)}
.icon-btn.primary{background:rgba(100,100,100,.5);border:1px solid rgba(255,255,255,.3)}
body.light-theme .icon-btn{background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.topic-btn{width:100%;padding:15px;background:rgba(100,100,100,.3);border:1px solid rgba(255,255,255,.2);border-radius:25px;color:#fff;font-size:15px;cursor:pointer;transition:all .3s;text-align:center}
.topic-btn:hover{background:rgba(120,120,120,.5);transform:translateY(-2px)}
body.light-theme .topic-btn{background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-content{background:rgba(20,20,20,.98);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:30px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
body.light-theme .modal-overlay{background:rgba(0,0,0,.5)}
body.light-theme .modal-content{background:rgba(255,255,255,.98);border:1px solid rgba(0,0,0,.1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.modal-header h2{margin:0;color:#fff}
body.light-theme .modal-header h2{color:#2a2a2a}
.close-btn{background:none;border:none;color:#808080;font-size:24px;cursor:pointer;padding:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:all .3s}
.close-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.setting-group{margin-bottom:15px}
.setting-group label{display:block;margin-bottom:5px;color:#b0b0b0;font-size:14px}
body.light-theme .setting-group label{color:#606060}
.setting-group input,.setting-group select,.setting-group textarea{width:100%;padding:10px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-size:14px;font-family:inherit}
.setting-group textarea{min-height:80px;resize:vertical}
body.light-theme .setting-group input,body.light-theme .setting-group select,body.light-theme .setting-group textarea{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.data-section{margin-top:20px;padding:15px;background:rgba(40,40,40,.5);border-radius:8px}
.data-section h3{margin-bottom:10px;font-size:16px}
.data-info{font-size:13px;color:#808080;margin-bottom:10px}
.post{background:rgba(20,20,20,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;margin-bottom:15px;transition:all .3s}
.post:hover{border-color:rgba(255,255,255,.2)}
body.light-theme .post{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.1)}
body.light-theme .post:hover{border-color:rgba(0,0,0,.2)}
.post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.post-author{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:rgba(100,100,100,.3);display:flex;align-items:center;justify-content:center;font-size:18px}
.author-info{display:flex;flex-direction:column}
.author-name{font-weight:600;color:#fff}
body.light-theme .author-name{color:#2a2a2a}
.post-time{font-size:12px;color:#808080}
.ai-badge{background:rgba(100,100,100,.3);padding:2px 8px;border-radius:4px;font-size:11px;color:#b0b0b0;margin-left:5px}
body.light-theme .ai-badge{background:rgba(0,0,0,.1);color:#606060}
.post-content{margin-bottom:15px;line-height:1.8;color:#d0d0d0}
body.light-theme .post-content{color:#3a3a3a}
.post-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{background:rgba(100,100,100,.2);padding:4px 10px;border-radius:12px;font-size:12px;color:#b0b0b0;cursor:pointer;transition:all .3s}
.tag:hover{background:rgba(100,100,100,.4)}
body.light-theme .tag{background:rgba(0,0,0,.08);color:#606060}
body.light-theme .tag:hover{background:rgba(0,0,0,.15)}
.post-actions{display:flex;gap:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05)}
body.light-theme .post-actions{border-top:1px solid rgba(0,0,0,.05)}
.action-btn{background:none;border:none;color:#808080;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:14px;transition:all .3s;padding:5px 10px;border-radius:6px}
.action-btn:hover{background:rgba(255,255,255,.05);color:#b0b0b0}
.action-btn.active{color:#fff}
body.light-theme .action-btn{color:#606060}
body.light-theme .action-btn:hover{background:rgba(0,0,0,.05);color:#2a2a2a}
body.light-theme .action-btn.active{color:#2a2a2a}
.action-btn.delete-btn{color:#ff6b6b}
.action-btn.delete-btn:hover{background:rgba(255,107,107,.1);color:#ff5252}
body.light-theme .action-btn.delete-btn{color:#d32f2f}
body.light-theme .action-btn.delete-btn:hover{background:rgba(211,47,47,.1);color:#c62828}
.comments-section{margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,.05)}
body.light-theme .comments-section{border-top:1px solid rgba(0,0,0,.05)}
.comment{background:rgba(40,40,40,.5);padding:12px;border-radius:8px;margin-bottom:10px}
body.light-theme .comment{background:rgba(0,0,0,.03)}
.comment-header{display:flex;justify-content:space-between;margin-bottom:8px}
.comment-author{font-weight:600;font-size:14px;color:#b0b0b0}
body.light-theme .comment-author{color:#606060}
.comment-content{font-size:14px;color:#d0d0d0}
body.light-theme .comment-content{color:#3a3a3a}
.comment-form{margin-top:10px}
.comment-form input{width:100%;padding:10px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-size:14px}
body.light-theme .comment-form input{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);color:#2a2a2a}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:20px}
.calendar-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .3s;position:relative}
.calendar-day:hover{transform:scale(1.1)}
.calendar-day.level-0{background:rgba(100,100,100,.2)}
.calendar-day.level-1{background:rgba(100,200,100,.3)}
.calendar-day.level-2{background:rgba(100,200,100,.5)}
.calendar-day.level-3{background:rgba(100,200,100,.7)}
.calendar-day.level-4{background:rgba(100,200,100,.9)}
.calendar-legend{display:flex;gap:10px;margin-top:15px;font-size:12px;color:#808080;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-box{width:15px;height:15px;border-radius:3px}
.day-posts{margin-top:20px}
.topic-item{background:rgba(40,40,40,.5);padding:15px;border-radius:8px;margin-bottom:10px;cursor:pointer;transition:all .3s}
.topic-item:hover{background:rgba(60,60,60,.6)}
.topic-title{font-weight:600;margin-bottom:5px}
.topic-meta{font-size:12px;color:#808080}
@media(max-width:768px){.container{padding:10px}h1{font-size:20px}.post{padding:15px}.header-buttons{gap:5px}.btn{padding:6px 12px;font-size:13px}.fab{width:50px;height:50px;font-size:24px;bottom:20px;right:20px}.fab.active{width:95%;max-width:none}}
</style>
</head>
<body>
<header>
<div class="header-content">
<h1>AI智能论坛</h1>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索帖子..." oninput="searchPosts(this.value)">
</div>
<div class="header-buttons">
<button class="btn" onclick="showCalendar()">📅</button>
<button class="btn" onclick="showSettings()">⚙️</button>
</div>
</div>
</header>

<div class="fab" id="fab" onclick="togglePostEditor()">+</div>

<div class="post-cards" id="postCards">
<div class="post-card">
<div class="post-input-wrapper" id="inputWrapper">
<textarea id="postContent" placeholder="分享你的想法..." rows="1" style="flex:1;padding:12px 18px;background:rgba(40,40,40,.8);border:1px solid rgba(255,255,255,.1);border-radius:25px;color:#fff;font-size:15px;font-family:inherit;resize:none;overflow:hidden"></textarea>
<button class="icon-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
<button class="icon-btn primary" onclick="createPost()" title="发送">➤</button>
</div>
</div>
<div class="post-card">
<button class="topic-btn" onclick="showTopicSelector()">📌 发起话题</button>
</div>
</div>

<div class="modal-overlay" id="settingsModal">
<div class="modal-content">
<div class="modal-header">
<h2>系统设置</h2>
<button class="close-btn" onclick="hideSettings()">✕</button>
</div>
<div class="setting-group">
<label>DeepSeek API Key</label>
<input type="password" id="apiKey" placeholder="输入你的API Key">
</div>
<div class="setting-group">
<label>AI发帖频率（分钟）</label>
<input type="number" id="aiPostInterval" value="2" min="1">
</div>
<div class="setting-group">
<label>AI互动频率（秒）</label>
<input type="number" id="aiInteractInterval" value="30" min="1">
</div>
<div class="setting-group">
<label>推荐算法权重</label>
<select id="recommendWeight">
<option value="high">高（强个性化）</option>
<option value="medium" selected>中（平衡）</option>
<option value="low">低（随机探索）</option>
</select>
</div>
<div class="setting-group">
<label>用户名</label>
<input type="text" id="username" value="用户" placeholder="输入你的用户名">
</div>
<div class="setting-group">
<label>主题模式</label>
<select id="themeMode">
<option value="dark">深色模式</option>
<option value="light">浅色模式</option>
</select>
</div>
<div class="setting-group">
<label>AI工作规则（自然语言描述）</label>
<textarea id="aiRules" placeholder="例如：多发一些关于科技的帖子，评论要简短有趣，不要太严肃..."></textarea>
</div>
<div class="data-section">
<h3>数据管理</h3>
<div class="data-info">
帖子数量: <span id="postCount">0</span> | 
用户发帖: <span id="userPostCount">0</span> | 
AI发帖: <span id="aiPostCount">0</span>
</div>
<div style="display:flex;gap:10px;margin-top:10px">
<button class="btn" onclick="exportData()">📤 导出数据</button>
<button class="btn" onclick="importData()">📥 导入数据</button>
<button class="btn delete-btn" onclick="clearAllData()">🗑️ 清空数据</button>
</div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
</div>
<div class="modal-actions">
<button class="btn" onclick="hideSettings()">取消</button>
<button class="btn btn-primary" onclick="saveSettings()">保存并应用</button>
</div>
</div>
</div>

<div class="modal-overlay" id="calendarModal">
<div class="modal-content">
<div class="modal-header">
<h2>发帖日历</h2>
<button class="close-btn" onclick="hideCalendar()">✕</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
<div class="calendar-legend">
<span>发帖数量：</span>
<div class="legend-item"><div class="legend-box" style="background:rgba(100,100,100,.2)"></div><span>0</span></div>
<div class="legend-item"><div class="legend-box" style="background:rgba(100,200,100,.3)"></div><span>1-2</span></div>
<div class="legend-item"><div class="legend-box" style="background:rgba(100,200,100,.5)"></div><span>3-5</span></div>
<div class="legend-item"><div class="legend-box" style="background:rgba(100,200,100,.7)"></div><span>6-10</span></div>
<div class="legend-item"><div class="legend-box" style="background:rgba(100,200,100,.9)"></div><span>10+</span></div>
</div>
<div class="day-posts" id="dayPosts"></div>
</div>
</div>

<div class="modal-overlay" id="topicModal">
<div class="modal-content">
<div class="modal-header">
<h2>发起话题</h2>
<button class="close-btn" onclick="hideTopicSelector()">✕</button>
</div>
<div class="setting-group">
<label>话题标题</label>
<input type="text" id="topicTitle" placeholder="输入话题标题...">
</div>
<div class="setting-group">
<label>话题描述</label>
<textarea id="topicDesc" placeholder="描述这个话题的内容和方向..."></textarea>
</div>
<div class="modal-actions">
<button class="btn" onclick="hideTopicSelector()">取消</button>
<button class="btn btn-primary" onclick="createTopic()">创建话题</button>
</div>
<div id="topicList" style="margin-top:20px"></div>
</div>
</div>

<div class="container">
<div id="postsContainer"></div>
</div>

<script>
let posts=[];
let userProfile={likes:[],comments:[],favorites:[],interests:{},viewedPosts:[],lastInteractions:{}};
let settings={apiKey:'',aiPostInterval:2,aiInteractInterval:30,recommendWeight:'medium',username:'用户',themeMode:'dark',aiRules:''};
let topics=[];
let aiTimers={postTimer:null,interactTimer:null};

const aiPersonas=[
{name:'张明',avatar:'张'},{name:'李红',avatar:'李'},{name:'王建国',avatar:'王'},{name:'刘思远',avatar:'刘'},
{name:'陈博文',avatar:'陈'},{name:'赵雨晴',avatar:'赵'},{name:'孙浩然',avatar:'孙'},{name:'周婷婷',avatar:'周'},
{name:'吴晓峰',avatar:'吴'},{name:'郑美玲',avatar:'郑'},{name:'林浩宇',avatar:'林'},{name:'黄思琪',avatar:'黄'},
{name:'徐文静',avatar:'徐'},{name:'朱俊杰',avatar:'朱'},{name:'何雅婷',avatar:'何'},{name:'高远',avatar:'高'},
{name:'宋佳怡',avatar:'宋'},{name:'韩宇轩',avatar:'韩'},{name:'曹诗涵',avatar:'曹'},{name:'邓浩天',avatar:'邓'},
{name:'冯雪莹',avatar:'冯'},{name:'谢俊豪',avatar:'谢'},{name:'袁梦琪',avatar:'袁'},{name:'蒋文博',avatar:'蒋'},
{name:'沈雅琳',avatar:'沈'},{name:'潘浩然',avatar:'潘'},{name:'董思远',avatar:'董'},{name:'薛晓彤',avatar:'薛'},
{name:'贾俊杰',avatar:'贾'},{name:'覃美玲',avatar:'覃'},{name:'汪浩宇',avatar:'汪'},{name:'龙思琪',avatar:'龙'},
{name:'段文静',avatar:'段'},{name:'崔俊杰',avatar:'崔'},{name:'史雅婷',avatar:'史'},{name:'顾远',avatar:'顾'},
{name:'侯佳怡',avatar:'侯'},{name:'邵宇轩',avatar:'邵'},{name:'毛诗涵',avatar:'毛'},{name:'万浩天',avatar:'万'},
{name:'温雪莹',avatar:'温'},{name:'康俊豪',avatar:'康'},{name:'雷梦琪',avatar:'雷'},{name:'苏文博',avatar:'苏'},
{name:'田雅琳',avatar:'田'},{name:'范浩然',avatar:'范'},{name:'姚思远',avatar:'姚'},{name:'邹晓彤',avatar:'邹'},
{name:'石俊杰',avatar:'石'},{name:'熊美玲',avatar:'熊'}
];

function init(){
loadData();
renderPosts();
startAIActivities();
updateDataStats();
}

function loadData(){
const savedPosts=localStorage.getItem('forumPosts');
const savedProfile=localStorage.getItem('userProfile');
const savedSettings=localStorage.getItem('forumSettings');
const savedTopics=localStorage.getItem('forumTopics');
if(savedPosts)posts=JSON.parse(savedPosts);
if(savedProfile){
const loaded=JSON.parse(savedProfile);
userProfile={
likes:loaded.likes||[],
comments:loaded.comments||[],
favorites:loaded.favorites||[],
interests:loaded.interests||{},
viewedPosts:loaded.viewedPosts||[],
lastInteractions:loaded.lastInteractions||{}
};
}
if(savedTopics)topics=JSON.parse(savedTopics);
if(savedSettings){
settings=JSON.parse(savedSettings);
applySettings();
}
}

function saveData(){
localStorage.setItem('forumPosts',JSON.stringify(posts));
localStorage.setItem('userProfile',JSON.stringify(userProfile));
localStorage.setItem('forumTopics',JSON.stringify(topics));
}

function applySettings(){
document.getElementById('apiKey').value=settings.apiKey;
document.getElementById('aiPostInterval').value=settings.aiPostInterval;
document.getElementById('aiInteractInterval').value=settings.aiInteractInterval;
document.getElementById('recommendWeight').value=settings.recommendWeight;
document.getElementById('username').value=settings.username;
document.getElementById('themeMode').value=settings.themeMode;
document.getElementById('aiRules').value=settings.aiRules||'';
if(settings.themeMode==='light'){
document.body.classList.add('light-theme');
}else{
document.body.classList.remove('light-theme');
}
}

function showSettings(){
updateDataStats();
document.getElementById('settingsModal').classList.add('active');
}

function hideSettings(){
document.getElementById('settingsModal').classList.remove('active');
}

function saveSettings(){

async function callDeepSeek(prompt,systemPrompt='',contextInfo=null){
if(!settings.apiKey){
console.log('未设置API Key，使用模拟回复');
return generateMockResponse(prompt);
}
try{
let finalSystemPrompt=systemPrompt||'你是一个友好、有思想的论坛用户，回复要自然、有人情味，不要太长，控制在100字以内。';
if(settings.aiRules){
finalSystemPrompt+='\n\n用户要求：'+settings.aiRules;
}
finalSystemPrompt+='\n\n重要规则：\n1. 你能看到帖子的所有回复，请不要发出与已有回复重复的内容\n2. 仔细查看历史评论，避免重复观点\n3. 如果话题已经被充分讨论，可以提供新的角度或补充信息';
if(contextInfo){
if(contextInfo.existingComments&&contextInfo.existingComments.length>0){
finalSystemPrompt+='\n\n当前帖子已有的评论：\n'+contextInfo.existingComments.map(c=>`- ${c.author}: ${c.content}`).join('\n');
}
if(contextInfo.recentAIHistory&&contextInfo.recentAIHistory.length>0){
finalSystemPrompt+='\n\n你最近的20条发言历史（避免重复）：\n'+contextInfo.recentAIHistory.map(h=>`- ${h.content.substring(0,50)}...`).join('\n');
}
}
const response=await fetch('https://api.deepseek.com/v1/chat/completions',{
method:'POST',
headers:{
'Content-Type':'application/json',
'Authorization':`Bearer ${settings.apiKey}`
},
body:JSON.stringify({
model:'deepseek-chat',
messages:[
{role:'system',content:finalSystemPrompt},
{role:'user',content:prompt}
],
temperature:0.8,
max_tokens:200
})
});
const data=await response.json();
return data.choices[0].message.content;
}catch(error){
console.error('API调用失败:',error);
return generateMockResponse(prompt);
}
}

function generateMockResponse(prompt){
const responses=[
'这个观点很有意思，我也有类似的想法。',
'说得好！我完全同意你的看法。',
'这让我想到了另一个角度...',

'这个想法挺新颖的，值得尝试。',
'我有不同的看法，但也很尊重你的观点。'
];
return responses[Math.floor(Math.random()*responses.length)];
}

function generateTags(content){
const keywords=['生活','工作','学习','思考','分享','经验','感悟','日常','心情','美食','旅行','音乐','电影','读书','运动','健康','科技','创意','灵感','成长'];
const tags=[];
keywords.forEach(keyword=>{
if(content.includes(keyword)&&tags.length<3){
tags.push(keyword);
}
});
if(tags.length===0){
const randomTags=['随笔','杂谈','闲聊','日记'];
tags.push(randomTags[Math.floor(Math.random()*randomTags.length)]);
}
return tags;
}

async function aiGeneratePost(){
const persona=aiPersonas[Math.floor(Math.random()*aiPersonas.length)];
let topicId=null;
let topicTitle='';
if(topics.length>0){
for(let topic of topics){
const daysSinceCreation=(Date.now()-topic.createdAt)/(1000*60*60*24);
const probability=Math.max(0,0.55-daysSinceCreation*0.05);
if(Math.random()<probability){
topicId=topic.id;
topicTitle=topic.title;
break;
}
}
}
let prompt;
if(topicId){
prompt=`围绕话题"${topicTitle}"，写一段自然、有个人观点的帖子内容，要像真人发帖一样，可以分享日常生活中的小事、个人感受或有趣的经历。控制在150字以内。`;

function calculateRecommendScore(post){
let score=0;
if(!userProfile.lastInteractions)userProfile.lastInteractions={};
const hasNewInteraction=userProfile.lastInteractions[post.id]&&(Date.now()-userProfile.lastInteractions[post.id])<3600000;
if(hasNewInteraction)score+=40;
if(!userProfile.viewedPosts)userProfile.viewedPosts=[];
const isViewed=userProfile.viewedPosts.includes(post.id);
if(!isViewed)score+=50;
const contentWords=post.content.split(/\s+/);
let interestMatch=0;
contentWords.forEach(word=>{
if(userProfile.interests&&userProfile.interests[word]){
interestMatch+=userProfile.interests[word];
}
});
score+=interestMatch*0.1;
const hoursSincePost=(Date.now()-post.timestamp)/(1000*60*60);
score*=Math.exp(-hoursSincePost/24);
if(score===0)score=1;
return score;
}

function formatTime(timestamp){
const now=Date.now();
const diff=now-timestamp;
const minutes=Math.floor(diff/60000);
const hours=Math.floor(diff/3600000);
const days=Math.floor(diff/86400000);
if(minutes<1)return'刚刚';
if(minutes<60)return`${minutes}分钟前`;
if(hours<24)return`${hours}小时前`;
if(days<7)return`${days}天前`;
return new Date(timestamp).toLocaleDateString('zh-CN');
}

function getRecentAIHistory(limit=20){
const aiContents=[];
for(let i=0;i<posts.length&&aiContents.length<limit;i++){
const post=posts[i];
if(post.isAI){
aiContents.push({type:'post',content:post.content,timestamp:post.timestamp});
}
post.comments.forEach(comment=>{
if(comment.isAI&&aiContents.length<limit){
aiContents.push({type:'comment',content:comment.content,timestamp:comment.timestamp});
}
if(comment.replies){
comment.replies.forEach(reply=>{
if(reply.isAI&&aiContents.length<limit){
aiContents.push({type:'reply',content:reply.content,timestamp:reply.timestamp});
}
});
}
});
}
return aiContents.sort((a,b)=>b.timestamp-a.timestamp).slice(0,limit);
}

async function aiReplyToUser(post,userComment){
const persona=aiPersonas[Math.floor(Math.random()*aiPersonas.length)];
const recentAIHistory=getRecentAIHistory(20);
const contextInfo={
existingComments:post.comments,
recentAIHistory:recentAIHistory,
postContent:post.content
};
const prompt=`用户刚刚评论了："${userComment.content}"，这是在帖子"${post.content}"下的评论。请写一条自然、友好的回复，像真人对话一样。控制在50字以内。`;
const replyContent=await callDeepSeek(prompt,'你是一个友好的论坛用户，正在与其他用户互动。回复要自然、有人情味，不要太正式。',contextInfo);
const aiReply={
id:Date.now(),
author:persona.name,
avatar:persona.avatar,
content:replyContent,
isAI:true,
timestamp:Date.now(),
replies:[]
};
post.comments.push(aiReply);
userProfile.lastInteractions[post.id]=Date.now();
saveData();
renderPosts();
console.log('AI回复了用户评论:',persona.name);
}

async function aiReplyToUserInThread(post,originalComment,userReplyContent){
const persona=aiPersonas[Math.floor(Math.random()*aiPersonas.length)];
const recentAIHistory=getRecentAIHistory(20);
const contextInfo={
existingComments:post.comments,
recentAIHistory:recentAIHistory,
postContent:post.content,
originalComment:originalComment.content
};
const prompt=`用户回复了你的评论"${originalComment.content}"，说："${userReplyContent}"。请写一条自然、友好的回复。控制在50字以内。`;
const replyContent=await callDeepSeek(prompt,'你是一个友好的论坛用户，正在与其他用户进行对话。回复要自然、有人情味。',contextInfo);
if(!originalComment.replies)originalComment.replies=[];
originalComment.replies.push({
id:Date.now(),
author:persona.name,
avatar:persona.avatar,
content:replyContent,
isAI:true,
timestamp:Date.now(),
replyTo:settings.username
});
userProfile.lastInteractions[post.id]=Date.now();
saveData();
renderPosts();
console.log('AI在评论串中回复了用户:',persona.name);
}
